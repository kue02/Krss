name: Release

on:
  push:
    tags:
      # 三段 / 四段都算发版（1.1.6 / 1.1.6.1）。四段 tag 只出 :latest 与完整版本 tag，
      # 不推 :x.y / :x 滚动 tag —— 否则 1.1.6.1 会把 1.1.6 的 :1.1 tag 顶掉。
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc -b

      - name: Run tests
        run: bun run test

  build:
    needs: [test-backend, test-frontend]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          # 四段版本（1.1.6.1）是补丁之上的热修：只出 :latest 与 :1.1.6.1，
          # 别去覆盖 :1.1 / :1 这两个滚动 tag（它们属于 1.1.6 那条线）。
          PARTS=$(echo "$VERSION" | awk -F. '{print NF}')
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
          echo "parts=${PARTS}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMG=${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}
          VER=${{ steps.version.outputs.version }}
          if [ "${{ steps.version.outputs.parts }}" = "3" ]; then
            TAGS="-t $IMG:latest -t $IMG:$VER -t $IMG:${{ steps.version.outputs.minor }} -t $IMG:${{ steps.version.outputs.major }}"
          else
            TAGS="-t $IMG:latest -t $IMG:$VER"
          fi
          docker buildx imagetools create $TAGS $(printf "$IMG@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          # 用 gh CLI 必须显式给 token：原 action 会自己注入，run 步骤不会
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 路径在 shell 里拼：写在 env 值里的 `${VAR}` 既不会被 Actions 展开、
          # bash 也不会递归展开（2026-10-10 v1.1.2 踩过 —— 路径永远匹配不到，
          # 于是每次都回落到自动生成的提交历史）。
          # 文件名带 v 前缀（docs/releases/v1.1.1.md），而 version 输出已剥掉 v。
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/releases/v${VERSION}.md"
          if [ -s "$NOTES" ]; then
            # 人工撰写的分类更新说明（docs/releases/vX.Y.Z.md）；缺失时回落到自动生成
            gh release create "$GITHUB_REF_NAME" \
              --repo "${{ github.repository }}" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "${{ github.repository }}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
