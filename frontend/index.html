<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=contain"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#E3E1DE"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#242933"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS 27 applies an uncontrollable hard edge blur to translucent PWA status bars. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Krss" />
    <meta name="description" content="A modern RSS reader" />
    <script>
      (() => {
        let mode = "system";
        let lightTheme = "light";
        let darkTheme = "dark";
        try {
          // 键名 krss-*（改名清理后不留老键兼容）—— 首屏要跟 useTheme 读的是同一份值
          mode = localStorage.getItem("krss-theme") || "system";
          lightTheme =
            localStorage.getItem("krss-light-theme") || "light";
          darkTheme =
            localStorage.getItem("krss-dark-theme") || "dark";
        } catch {
          // Use the system theme when storage is unavailable.
        }

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = mode === "dark" || (mode === "system" && prefersDark);
        const root = document.documentElement;
        root.dataset.theme = isDark ? darkTheme : lightTheme;
        root.classList.toggle("dark", isDark);
        root.classList.toggle("light", !isDark);
      })();
    </script>
    <style>
      :root {
        background-color: #e3e1de;
      }

      :root[data-theme="stone"] {
        background-color: #e3e1de;
      }

      :root[data-theme="leaf"] {
        background-color: #dfe7e1;
      }

      :root[data-theme="dark"],
      :root[data-theme="nord-dark"] {
        background-color: #242933;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          background-color: #242933;
        }
      }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Krss</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const BOOT_READY_ATTR = "data-krss-boot-ready";
        const SOFT_RELOAD_KEY = "krss.boot.soft_count";
        const HARD_RECOVER_KEY = "krss.boot.hard_count";
        const SOFT_RELOAD_LIMIT = 1;
        const HARD_RECOVER_LIMIT = 1;
        const SOFT_RELOAD_TIMEOUT_MS = 3500;
        const HARD_RECOVER_TIMEOUT_MS = 12000;
        const SOFT_PARAM = "_boot_soft";
        const HARD_PARAM = "_boot_hard";

        const isStandalone =
          (typeof window.matchMedia === "function" &&
            window.matchMedia("(display-mode: standalone)").matches) ||
          window.navigator.standalone === true;

        if (!isStandalone) return;

        const bootLog = (...args) => console.info("[boot-guard]", ...args);
        const bootWarn = (...args) => console.warn("[boot-guard]", ...args);

        const isBootReady = () =>
          document.documentElement.getAttribute(BOOT_READY_ATTR) === "1" ||
          window.__KRSS_BOOT_READY__ === true;

        const hasSessionStorage = (() => {
          try {
            const probeKey = "__krss_boot_probe__";
            sessionStorage.setItem(probeKey, "1");
            sessionStorage.removeItem(probeKey);
            return true;
          } catch {
            return false;
          }
        })();

        const readCount = (key, param) => {
          if (hasSessionStorage) {
            const raw = sessionStorage.getItem(key);
            if (!raw) return 0;
            const count = Number.parseInt(raw, 10);
            return Number.isFinite(count) ? count : 0;
          }

          const raw = new URL(window.location.href).searchParams.get(param);
          if (!raw) return 0;
          const count = Number.parseInt(raw, 10);
          return Number.isFinite(count) ? count : 0;
        };

        const writeCount = (key, param, count) => {
          if (hasSessionStorage) {
            sessionStorage.setItem(key, String(count));
            return;
          }

          const url = new URL(window.location.href);
          url.searchParams.set(param, String(count));
          history.replaceState(history.state, "", url.toString());
        };

        const tryIncrement = (key, param, limit) => {
          const count = readCount(key, param);
          if (count >= limit) return false;
          writeCount(key, param, count + 1);
          return true;
        };

        const replaceWithFlag = (param) => {
          const url = new URL(window.location.href);
          url.searchParams.set(param, String(Date.now()));
          window.location.replace(url.toString());
        };

        const activateWaitingServiceWorker = async () => {
          if (!("serviceWorker" in navigator)) return;

          try {
            const registrations =
              await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              if (!registration.waiting) continue;
              registration.waiting.postMessage({ type: "SKIP_WAITING" });
            }
          } catch (error) {
            bootWarn("failed to activate waiting service worker", error);
          }
        };

        const clearServiceWorkerAndCaches = async () => {
          bootWarn(
            "hard recovery: unregistering service workers and clearing caches",
          );

          if ("serviceWorker" in navigator) {
            try {
              const registrations =
                await navigator.serviceWorker.getRegistrations();
              await Promise.all(
                registrations.map((registration) => registration.unregister()),
              );
            } catch (error) {
              bootWarn("failed to unregister service workers", error);
            }
          }

          if ("caches" in window) {
            try {
              const cacheKeys = await caches.keys();
              await Promise.all(
                cacheKeys.map((cacheKey) => caches.delete(cacheKey)),
              );
            } catch (error) {
              bootWarn("failed to clear cache storage", error);
            }
          }
        };

        /**
         * 22-1：**页面不可见时不重载**，改成等它可见再判。
         *
         * 为什么要挡：就绪标记（`main.tsx` 的 `markBootReady`）挂在 rAF 上，而隐藏/被遮挡的页面
         * 不跑 rAF ⇒ 隐藏时「没就绪」不等于「卡死了」。老写法照刷不误，于是**后台加载的 PWA 会自己
         * 刷自己**：实测 t+3567ms 触发软重载（`?_boot_soft=…`，整页重载一次）、
         * t+12059ms 再触发硬恢复（注销 SW + 清空 Cache Storage，又一次整页重载）——
         * 用户切回来看到的就是「自己刷新了一下」，而且缓存被清空后是最冷的启动（最长的英文窗口）。
         * 重试不消耗次数（`tryIncrement` 只在真刷的时候调），所以恢复能力一条没少，
         * 只是把「看不见的自救」推到用户能看见的时候。
         */
        const scheduleGuard = (delay, handler) => {
          setTimeout(() => {
            if (isBootReady()) return;
            if (document.visibilityState === "hidden") {
              scheduleGuard(delay, handler);
              return;
            }
            handler();
          }, delay);
        };

        scheduleGuard(SOFT_RELOAD_TIMEOUT_MS, async () => {
          if (!tryIncrement(SOFT_RELOAD_KEY, SOFT_PARAM, SOFT_RELOAD_LIMIT))
            return;

          bootWarn("startup timeout, triggering soft reload");
          await activateWaitingServiceWorker();
          replaceWithFlag(SOFT_PARAM);
        });

        scheduleGuard(HARD_RECOVER_TIMEOUT_MS, async () => {
          if (!tryIncrement(HARD_RECOVER_KEY, HARD_PARAM, HARD_RECOVER_LIMIT))
            return;

          bootWarn("hard recovery: unregistering service workers and clearing caches");
          await clearServiceWorkerAndCaches();
          replaceWithFlag(HARD_PARAM);
        });

        bootLog("boot guard active");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
